[project]
name = "api"
version = "0.1.0"
description = "Habbit API - habit tracking backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.9.1",
    "psycopg[binary]>=3.3.6",
    "sqlmodel>=0.0.48",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "alembic>=1.20.1",
    "boto3>=1.36",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: fluxo completo de ponta a ponta",
]

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
