services:
  postgresql:
    image: postgres:17-alpine
    container_name: habbit-postgres
    environment:
      POSTGRES_USER: habbit
      POSTGRES_PASSWORD: habbit
      POSTGRES_DB: habbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habbit"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: habbit-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgres://habbit:habbit@postgresql:5432/habbit"
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  pgdata:
