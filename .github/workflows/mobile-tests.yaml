name: Mobile Tests

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-tests.yaml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-tests.yaml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit tests and type check
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test
