name: Testing Habbit API application

on:
  push:
  pull_request:
    types:
      - reopened
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Unit and Integration tests
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: |
          uv install --dev --no-cache-dir --no-deps --upgrade --force-reinstall

      - name: Run tests
        run: pytest tests/ -v
